# 前端部署（Nginx 独立）

## 构建

```bash
cd web
npm install
npm run build
```

构建产物：`web/dist/`

## Nginx 配置

```nginx
server {
    listen 443 ssl;
    server_name wecom.zhang-yong.site;

    # SSL 证书（Cloudflare Origin 或 Let's Encrypt）
    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    # 前端静态资源
    location / {
        root /opt/ai-req/web/dist;
        try_files $uri $uri/ /index.html;
        index index.html;

        # 缓存静态资源
        location ~* \.(js|css|png|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }
    }

    # 后端 API 反代
    location /admin/api/ {
        proxy_pass http://127.0.0.1:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 企信回调（仍由后端处理）
    location /wecom/ {
        proxy_pass http://127.0.0.1:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OAuth 登录（企信内 + 外部浏览器扫码）
    location /admin/oauth/ {
        proxy_pass http://127.0.0.1:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
```

## 部署步骤

```bash
# 1. 构建
cd /Users/zhangyong/workspace/ai-requirement-assistant/web
npm run build

# 2. 上传 dist
scp -r dist/* root@aliyun-ecs:/opt/ai-req/web/dist/

# 3. 重载 Nginx
ssh root@aliyun-ecs "nginx -s reload"
```

## 回滚

保留旧版 `admin/index.html` 作为后端的 fallback（已加在 `AdminAuthFilter` 中）。

如果前端出问题，可以临时把 Nginx 的 `location /` 改回：

```nginx
location / {
    proxy_pass http://127.0.0.1:9080;  # 让后端服务原 admin/index.html
    try_files $uri $uri/ /admin/index.html;
}
```
